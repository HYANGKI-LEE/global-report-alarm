  - id: imf
    enabled: false   # 2026-10-20: imf.org RSS 폐지(404) → 아래 imf_elibrary 로 교체
    name: IMF
    page: https://www.imf.org/en/publications
    type: rss
    urls:
      - https://www.imf.org/en/Publications/RSS?language=eng

  # IMF 출판물 — imf.org/en/publications 의 'Latest Releases' (화면이 그려진 뒤 읽음, 6건)
  # (IMF eLibrary 는 GitHub 서버에 보안 확인 화면을 보여줘서 사용 불가 — imf_elibrary type 은 남겨둠)
  - id: imf_latest
    enabled: false   # 2026-10-20: GitHub 서버에는 imf.org 가 몇 달 지난 캐시 페이지로 보임 (지난 글 오알림 위험)
    name: IMF
    page: https://www.imf.org/en/publications
    type: page_links
    link_pattern: '/en/publications/[a-z0-9/-]+/issues/\d{4}/'
    strip_query: true
    series_map:
      /publications/wp/: Working Paper
      /publications/cr/: Country Report
      /selected-issues-papers/: Selected Issues Paper
