# 구독 대상 목록 — 사용자가 고른 페이지 단위로 하나씩 추가 (리포트 글은 한국어 요약 대기 목록에도 올라감)
#
#   id      : 내부 구분용 영문 이름 (한 번 정하면 바꾸지 않기 — 바꾸면 '처음 연결'로 취급됨)
#   name    : 텔레그램 메시지에 표시될 이름
#   page    : 사용자가 고른 원본 페이지 주소 (참고용 + 일부 type 은 여기서 필터를 읽음)
#   type    : 읽는 방식
#               imf_elibrary → IMF eLibrary 최신 발간 목록 (pages, exclude_title)
#               bis_list  → BIS All publications 목록 (pages: 몇 쪽까지 볼지)
#               wp_api    → 워드프레스 공개 API (api, post_type, mode: new|modified, series_after)
#               page_links → 범용: 목록 페이지에서 link_pattern(정규식)에 맞는 링크를 글로 봄
#               rss       → urls 의 RSS 주소를 위에서부터 시도해 처음 성공한 것 사용
#                           (max_items: 최신 몇 건만 볼지, 기본 100 / series_map: 링크 글자 → 시리즈명
#                            include: 링크에 이 글자(목록이면 그중 하나)가 들어간 항목만
#                            id_with_date: 주소에 연도가 없는 항목은 발표 시각을 붙여 매번 새 항목으로)
#               bostonfed → 보스턴 연준 검색 페이지. page 주소의 필터를 그대로 사용
#               nyfed_research → 뉴욕 연준 Research 메인의 Recent Publications 칸
#               phillyfed_search → 필라델피아 연준 검색 목록 페이지 (최신 30건)
#               clevelandfed_list → 클리블랜드 연준 출판물 목록 페이지 (최신 10건)
#               atlantafed_list → 애틀랜타 연준 출판물 시리즈 페이지 (series 로 시리즈명 지정)
#               chicagofed_series → 시카고 연준 출판물 시리즈 (series_id: 시리즈 목록 페이지 HTML 의 seriesIds 값)
#               gmail     → 봇 전용 Gmail 로 받은 기관 공식 이메일 알림 (from: 보낸 주소·도메인 목록)
#               datawatch → 데이터 업데이트 감지 (watch: files / regex / links, 자세한 건 main.py fetch_datawatch)
#   series  : (선택) 시리즈명이 없는 항목에 붙일 이름
#   series_map: (선택) 링크 주소 글자 → 시리즈명 (모든 type 공통)
#   link_to_page: (선택) true 면 제목 링크를 원문 대신 page(목록)로, 원문 발간일 확인 생략
#   exclude : (선택) 링크에 이 글자(목록이면 그중 하나)가 들어간 항목은 뺌 (모든 type 공통)
#   kind    : (선택) data 면 📊 데이터, private 면 💡 민간 리서치로 표시 (기본 🏛)
#   enabled : false 로 두면 잠시 끔

# 실제 브라우저(헤드리스 크롬)로 여는 호스트 — 단순 요청은 응답하지 않는 사이트 (robots.txt 로 수집 허용 확인함)
browser_hosts:
  - www.kansascityfed.org
  - www.imf.org

# 화면이 다 그려진 뒤 읽는 호스트 (목록을 자바스크립트로 불러오는 사이트, 자동으로 browser_hosts 에도 포함)
render_hosts:
  - www.imf.org

