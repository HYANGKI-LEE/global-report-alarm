name: poll-reports

on:
  schedule:
    # 30분마다 (매시 7분·37분 — 정각·30분은 GitHub 일정 실행이 몰려 지연이 큼). public 레포라 실행 시간 무제한
    - cron: "7,37 * * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: [sources.yaml, main.py, .github/workflows/poll.yml, test_request.txt]

permissions:
  contents: write

concurrency:
  group: poll-reports
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"   # 실행 시간 측정용

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 캔자스시티 연준 등 실제 브라우저로만 열리는 사이트용 (sources.yaml 의 browser_hosts)
      - run: python -m playwright install --with-deps chromium

      - name: 한국어 요약 반영 + 신규 리포트 확인 및 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}           # 초록 3줄 한국어 번역 (없으면 영어 원문)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # (미사용) Claude 한국어 요약
        run: python main.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/timing.json
          git add state/pending_summaries.json 2>/dev/null || true   # 한국어 요약 대기 목록
          git add -A test_request.txt 2>/dev/null || true   # 시험 발송 후 지운 요청 파일
          git diff --cached --quiet || (git commit -m "상태 갱신 [skip ci]" && git push)
