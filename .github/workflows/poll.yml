name: poll-reports

on:
  schedule:
    # 한국시간 08:00 / 13:00 / 18:00 (UTC 23 / 04 / 09시). GitHub 사정에 따라 수~수십 분 늦을 수 있음
    - cron: "0 23,4,9 * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: [sources.yaml, main.py, .github/workflows/poll.yml]

permissions:
  contents: write

concurrency:
  group: poll-reports
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 신규 리포트 확인 및 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "상태 갱신 [skip ci]" && git push)
